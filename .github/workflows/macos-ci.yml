# macOS CI — runs on GitHub's free macOS runners (free + unlimited because this
# repo is PUBLIC).
#
# The `core` job builds + unit-tests the shared C++ engine with APPLE's clang on
# every push/PR. That is the iOS production compiler family, so a green run here
# proves the core cross-compiles for the Apple side long before the Xcode app
# exists — no Mac hardware needed locally.
#
# The `ios-app` job builds the iOS app for the SIMULATOR (no code-signing, so no
# Apple Developer cert): CMake generates the Xcode project on the runner, then
# xcodebuild compiles it. This is how the iPhone half is verified with no local Mac.
name: macOS CI

on:
  push:
  pull_request:
  # MANUAL ONLY, and deliberately so: `agent` builds the RPS and Chess .ipas with -DLUR_AGENT=ON, which compiles
  # in assistant-only REMOTE CONTROL (injected input, forced state). CLAUDE.md's rule is that such a
  # build must never reach a player, so it can only be produced by asking for it by hand — never as a
  # by-product of a push, where the artifact sits next to the ordinary one and could be sideloaded by
  # mistake. The artifact is named -AGENT- for the same reason.
  workflow_dispatch:
    inputs:
      agent:
        description: "Also build the RPS and Chess .ipas with LUR_AGENT=ON (remote control; never give to a player)"
        type: boolean
        default: false

jobs:
  core:
    name: Core (Apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # cmake is preinstalled on GitHub macOS runners; ninja is not.
      - name: Install Ninja
        run: brew install ninja

      # No -DCMAKE_CXX_COMPILER: use the runner's default Apple clang on purpose — a different
      # compiler from the host loop's MinGW g++ is extra portability coverage, not an inconvenience.
      #
      # LUR_FAST=ON, not -DCMAKE_BUILD_TYPE=Debug. This job wants fast COMPILES, and LUR_CONFIG is
      # the one dial: a driver hardcoding CMAKE_BUILD_TYPE is the #89 bug (every driver forced Debug,
      # so no build was ever actually optimized). EngineFlags FORCEs the variable anyway, so the old
      # flag was merely misleading rather than harmful — which is exactly how it would have survived
      # into a driver where it mattered.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DLUR_FAST=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # ── Shipping must COMPILE, and nothing else here checks that (#198) ──
      # Every other gate in this repo is Development: build.ps1, both Android debug builds, both
      # desktop harnesses and the jobs above. So the whole class of "a capability-gated symbol is
      # touched outside its #if guard" is invisible to all of them — and it was, for 46 commits, until
      # someone configured Shipping by hand on 2026-08-22.
      #
      # No tests: the unit tests are LUR_INTERNAL-shaped and Shipping deliberately has no tooling.
      # Compiling is the whole point, and it is seconds.
      - name: Configure (Shipping)
        run: cmake -S . -B build-ship -G Ninja -DLUR_CONFIG=Shipping -DLUR_FAST=ON -DLUR_BUILD_TESTS=OFF

      - name: Build (Shipping)
        run: cmake --build build-ship

  ios-app:
    name: iOS app (simulator build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # MoltenVK (Vulkan-on-Metal) — the one sanctioned third-party dep. Fetch the
      # prebuilt static xcframework + Vulkan headers; cache by version so the 165 MB
      # download happens once and is shared across jobs/runs.
      - name: Cache MoltenVK
        id: mvk
        uses: actions/cache@v4
        with:
          path: mvk
          key: moltenvk-1.4.1-ios
      - name: Fetch MoltenVK (v1.4.1)
        if: steps.mvk.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/MoltenVK-all.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-all.tar
          mkdir -p mvk
          tar -xf /tmp/MoltenVK-all.tar -C mvk \
            MoltenVK/MoltenVK/include \
            MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64 \
            MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64_x86_64-simulator

      # The iOS app is its own CMake project (like Android's), pulling in the shared
      # C++ core via add_subdirectory. CMake generates the .xcodeproj on the runner,
      # so nobody opens Xcode locally.
      - name: Configure (CMake -> Xcode project)
        run: |
          cmake -S Games/Chess/iOS -B Games/Chess/iOS/build -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DMOLTENVK_DIR="$GITHUB_WORKSPACE/mvk/MoltenVK/MoltenVK" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO

      # Simulator build => no signing, no Apple Developer cert required.
      - name: Build for iOS Simulator
        run: |
          xcodebuild -project Games/Chess/iOS/build/OnlyChess.xcodeproj \
            -scheme OnlyChess -configuration Debug \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build

  # ── The .ipa jobs, as ONE matrix (#198) ──────────────────────────────────────
  # This was FOUR near-identical jobs — chess, RPS, and an AGENT variant of each — roughly 240 lines
  # of copy. Per-game CI jobs are the third axis of the boilerplate #198 exists to remove (per game x
  # per platform x per tool), and a third game would have made it six.
  #
  # The agent rows are gated per-ROW rather than per-job, which is the whole reason a matrix works
  # here: `if` may read the matrix context, so `agent: true` rows are skipped on an ordinary push and
  # run only on a manual dispatch that asked for them. That gate is load-bearing, not tidiness — an
  # agent .ipa is remote-controllable, and building it on every push would leave it sitting in the
  # artifact list next to the player one, one mis-click from being sideloaded. Its ARTIFACT NAME
  # carries -AGENT- for the same reason.
  ios-ipa:
    name: ${{ matrix.app }} iOS .ipa${{ matrix.agent && ' — AGENT (manual, never for a player)' || ' (for sideloading)' }}
    if: ${{ !matrix.agent || (github.event_name == 'workflow_dispatch' && inputs.agent) }}
    runs-on: macos-latest
    strategy:
      # One game's failure must not cancel the other's — a broken RPS build should still tell us
      # whether chess is fine.
      fail-fast: false
      matrix:
        include:
          - { dir: Chess,               app: OnlyChess, agent: false }
          - { dir: RocksPapersScissors, app: OnlyRps,   agent: false }
          - { dir: Chess,               app: OnlyChess, agent: true  }
          - { dir: RocksPapersScissors, app: OnlyRps,   agent: true  }
    steps:
      - uses: actions/checkout@v4

      - name: Cache MoltenVK
        id: mvk
        uses: actions/cache@v4
        with:
          path: mvk
          key: moltenvk-1.4.1-ios
      - name: Fetch MoltenVK (v1.4.1)
        if: steps.mvk.outputs.cache-hit != 'true'
        run: |
          curl -fL -o /tmp/MoltenVK-all.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-all.tar
          mkdir -p mvk
          tar -xf /tmp/MoltenVK-all.tar -C mvk \
            MoltenVK/MoltenVK/include \
            MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64 \
            MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64_x86_64-simulator

      # A DEVICE build (arm64, iphoneos) with signing disabled. The simulator app cannot use real
      # Bluetooth, so a cross-platform test needs the app on a physical iPhone — which means a device
      # build. It is unsigned; the dev rig signs it at install time with a free Apple ID.
      #
      # Separate build directories per row so a cached agent tree can never be mistaken for the
      # player one — the two differ by a compile definition, which no artifact name would reveal.
      - name: Configure (device, unsigned)
        run: |
          cmake -S Games/${{ matrix.dir }}/iOS -B Games/${{ matrix.dir }}/iOS/build-${{ matrix.agent && 'agent' || 'device' }} -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DMOLTENVK_DIR="$GITHUB_WORKSPACE/mvk/MoltenVK/MoltenVK" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            ${{ matrix.agent && '-DLUR_AGENT=ON' || '' }}

      # -configuration Debug is what it has always been, and it no longer decides optimization:
      # lur_configure_app_target pins GCC_OPTIMIZATION_LEVEL from LUR_CONFIG (#198), because Xcode
      # ignores CMAKE_BUILD_TYPE and this flag used to hard-force -O0 — a 20x sim.step gap that read
      # as an iPhone performance problem for a full investigation.
      - name: Build (device, unsigned)
        run: |
          xcodebuild -project Games/${{ matrix.dir }}/iOS/build-${{ matrix.agent && 'agent' || 'device' }}/${{ matrix.app }}.xcodeproj \
            -scheme ${{ matrix.app }} -configuration Debug \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      # Wrap the .app in the standard Payload/ layout and zip it to a .ipa.
      - name: Package unsigned .ipa
        run: |
          APP=$(find Games/${{ matrix.dir }}/iOS/build-${{ matrix.agent && 'agent' || 'device' }} -name '${{ matrix.app }}.app' -type d | head -1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry ${{ matrix.app }}${{ matrix.agent && '-AGENT' || '' }}-unsigned.ipa Payload

      # Artifact names are UNCHANGED from the four hand-written jobs — Tools/DeviceRig downloads
      # them by name, so renaming would break the headless install path.
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}${{ matrix.agent && '-AGENT' || '' }}-unsigned-ipa
          path: ${{ matrix.app }}${{ matrix.agent && '-AGENT' || '' }}-unsigned.ipa
          if-no-files-found: error
